name: Sync projects data

on:
  schedule:
    # Weekly — Monday 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync projects data
        id: sync
        run: node scripts/sync-projects.mjs --token "${{ secrets.GH_SYNC_TOKEN }}"
        # Exit 1 means "data changed" — we convert that to a success with changed=true.
        continue-on-error: true

      - name: Report change status
        id: status
        run: echo "changed=${{ steps.sync.outcome == 'failure' }}" >> "$GITHUB_OUTPUT"

      - name: Open / update sync PR
        if: steps.status.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_SYNC_TOKEN }}
          branch: chore/sync-projects
          title: "chore: sync projects data"
          commit-message: "chore: sync projects data from repo manifests"
          delete-branch: true
          base: main
          body: |
            Auto-generated by the weekly projects sync.

            - Projects pulled from `project.yml` manifests + GitHub repo metadata.
            - If a project was added/removed/updated, it shows up here.

            Review and merge to publish to the portfolio. Revert the merge to undo.
