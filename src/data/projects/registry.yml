  - slug: izmo
    name: izmo
    year: "2022 to now"
    tagline: AI-assisted dealership platform, built end to end.
    summary: >-
      Four years of full stack work on a dealership platform used across Europe. I
      built an AI page builder for the CMS, raised the speed score of big
