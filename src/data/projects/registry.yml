    category: corporate
    links:
      - label: Live site
        href: https://www.izmocars.com/
  - slug: trackprobe
    name: TrackProbe
    year: "2026"
    tagline: GA4 and GTM auditing that checks what really fires.
    summary: >-
      An analytics auditing tool that compares what is configured in Google
      Analytics and Tag Manager with what actually fires in the browser during a
      crawl, then scores the gaps, duplicates, and consent issues in a report
      you can export. In active development.
    body: >-
      TrackProbe audits Google Analytics and Tag Manager setups on real
      websites. Instead of trusting the admin settings alone, it crawls pages in
      a controlled browser, captures the analytics calls that actually fire, and
      compares them against the configuration and the reported volume.

      Events are marked as verified, production confirmed, suspected gaps, or
      unreached, with clear reliability when bot protection limits the crawl.
      The result is a scored report you can export. It is currently in active
      development.
    stack: [Next.js, TypeScript, Playwright, Google APIs]
    status: upcoming
    category: product
    explored: true
    links: []
  - slug: consentvalidator
    name: Consent Validator
    year: "2026 to now"
    tagline: Check that cookie consent really works.
    summary: >-
      Checks what a website actually does before consent, after reject and after
      accept, with screenshots, cookie and network evidence, plus a read-only GA4
      and Tag Manager audit including Consent Mode v2.
    body: >-
      Consent Validator is an independent check for cookie consent. It loads a
      site in a real browser three times, before consent, after rejecting and
      after accepting, and records the cookies, scripts, network requests and
      Google Consent Mode signals each time, so teams can prove tracking respects
      user choices.

      The web app runs on Next.js and Vercel with Supabase PostgreSQL and
      row-level security, while a Dockerized Playwright worker on Railway runs the
      audits with fair scheduling, watchdogs and reconciliation. Every run gets a
      clear evidence state and confidence level, so a clean result reads as a pass
      instead of an empty report.
    visual:
      src: /uploads/consentvalidator.jpg
      alt: "Consent Validator home page: know exactly what your consent stack does"
    stack: [Next.js, TypeScript, Playwright, Supabase, Docker]
    status: live
    category: product
    links:
      - label: Live
        href: https://www.consentvalidator.com/
  - slug: imageconverter
    name: ImageConverter
    year: "2026 to now"
    tagline: Convert images privately in your browser.
    summary: >-
      A free image converter and compressor for JPG, PNG, WebP, HEIC, AVIF and
      more. Everything runs in the browser, so files never leave the device.
    body: >-
      ImageConverter converts and compresses images entirely in the browser, with
      no backend, no upload and no API. It handles JPG, PNG, WebP, HEIC, GIF, BMP,
