# Registry of projects shown on the portfolio.
#
# This is the curation layer for the auto-sync pipeline:
#   - `repos`  → projects synced automatically from that repo's project.yml manifest
#                (falling back to repo description/homepage when no manifest exists)
#   - `manual` → projects with no public repo; content lives here directly
#   - `minPushedAt` → repos never pushed after this date are ignored unless forceInclude
#
# Regenerate the site data with:  node scripts/sync-projects.mjs
# See scripts/sync-projects.mjs for the full schema.

owner: akash-yadav-dev
minPushedAt: "2025-12-01"

repos:
  - repo: dimlypdf
    category: tool
    explored: true # kept in "Explorations"
  - repo: post-queue
    status: sunset # backend taken down to save hosting cost; site no longer works
    category: product
    explored: true # kept in "Explorations"
  - repo: faqflow
    category: product
  - repo: UnitCraft
    category: tool
    explored: true # kept in "Explorations"
  - repo: snipify
    include: false # tracked but curated out — keep as a candidate
  - repo: thumbnail-downloader
  - repo: post-queue-golang
    include: false # same product as post-queue, avoid duplicate
  - repo: mytodo

manual:
  - slug: browserzap
    name: BrowserZap
    year: "2026 to now"
    tagline: Let AI agents use your own Chrome, safely.
    summary: >-
      Lets AI agents like Claude Code, Codex and Cursor work in your own signed-in
      Chrome, with exact clicks and your approval before anything risky. Published
      on the Chrome Web Store and npm.
    body: >-
      BrowserZap connects an AI coding agent to the Chrome you already use,
      through an MCP server, a small Node.js bridge and a Chrome extension. There
      is no cloud browser and no copied cookies: the agent works in your real tab
      while you watch, and every click or fill is matched to exactly one element
      by its accessible role and name.

      Safety is built in. Submits, payments, deletions and uploads wait for your
      approval, the agent never types a password or one-time code, and a stop
      button takes the tab back at once. Agents can also read console errors and
      failed network requests to debug a page, and repeat a recorded workflow with
      new values.
    visual:
      src: /uploads/browserzap.jpg
      alt: "BrowserZap home page: MCP browser automation in the Chrome you already use"
    stack: [TypeScript, Node.js, MCP, Chrome Extension, WebSocket]
    status: live
    category: product
    links:
      - label: Live
        href: https://browserzap.com/
  - slug: mrrdue
    name: MRRdue
    year: "2026 to now"
    tagline: Recover failed subscription payments.
    summary: >-
      Watches Stripe or Dodo Payments, ranks every failed payment by what it costs
      you, and drafts the recovery email. You decide what goes out, and AI clients
      can read the data through a secure MCP server.
    body: >-
      MRRdue is a revenue recovery product for subscription businesses. It pulls
      billing data from Stripe and Dodo Payments, puts every failed payment and
      at-risk customer in one place, and ranks them by how much revenue is at
      stake, so the most valuable recoveries come first.

      Under the hood it uses verified webhooks, queued data imports, scheduled
      checks, encrypted provider keys and team workspaces on PostgreSQL. An OAuth
      2.1 MCP server lets AI assistants read revenue data and analysis, while any
      outreach still needs a human to approve it in the dashboard.
    visual:
      src: /uploads/mrrdue.jpg
      alt: "MRRdue home page: recover revenue before it disappears"
    stack: [Next.js, TypeScript, PostgreSQL, Prisma, Stripe, MCP]
    status: live
    category: product
    links:
      - label: Live
        href: https://www.mrrdue.com/
  - slug: aisearchaudit
    name: AI Search Audit
    year: "2026 to now"
    tagline: See what AI can actually read on your site.
    summary: >-
      A free audit that shows whether ChatGPT, Claude, Perplexity and other AI
      search engines can reach and read your website, checked against 27 rules and
      a 17-crawler access matrix.
    body: >-
      AI Search Audit checks how visible a website is to AI search. It scans the
      home page and key pages, reads the robots and discovery files, and tests
      whether each major AI crawler can reach the content, then scores the result
      across five areas with clear evidence for every finding.

      The engine is deterministic, so running the audit again after a fix shows
      exactly what changed. It also generates an llms.txt file. It is built with
      Next.js, Neon PostgreSQL and Drizzle ORM.
    visual:
      src: /uploads/aisearchaudit.jpg
      alt: "AI Search Audit home page: know what AI actually sees on your website"
    stack: [Next.js, TypeScript, PostgreSQL, Drizzle ORM]
    status: live
    category: product
    links:
      - label: Live
        href: https://www.aisearchaudit.pro/
  - slug: tryfreecalculator
    name: TryFreeCalculator
    year: "2026 to now"
    tagline: Free calculators that show their working.
    summary: >-
      A free library of 40 online calculators across 11 categories. Every result
      shows the formula with your numbers filled in, step by step, and everything
      runs in the browser with no sign-up.
    body: >-
      TryFreeCalculator is a free calculator library built with Astro as a fully
      static site on Cloudflare Pages. Each calculator is a single data file, and
      the pages, category listings, search and sitemap are all generated from one
      registry, so adding a new calculator takes minutes.

      Every result explains itself by showing the formula with the real numbers
      filled in, which makes the tools useful for learning as well as for quick
      answers. The site loads fast because there is no server and no sign-up.
    visual:
      src: /uploads/tryfreecalculator.jpg
      alt: "TryFreeCalculator home page: free online calculators that show their working"
    stack: [Astro, TypeScript, Cloudflare Pages]
    status: live
    category: tool
    links:
