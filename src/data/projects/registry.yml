      Next.js.
    body: >-
      izmo is my day job, where I have spent four years building a multi-brand
      dealership website platform used across Europe, first as an associate
      engineer and since April 2026 as a full stack software engineer. I work end
      to end, from Java and Spring Boot services and NestJS APIs to React, Redux
