  - slug: makeupnnow
    name: Makeupnnow
    year: "2026"
    tagline: A marketplace for makeup artists, built for a client.
    summary: >-
      Client project: a marketplace where people find professional makeup artists
      by category and location. I built the production Next.js site from the
